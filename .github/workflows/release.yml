name: UniAttend Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  get-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Set Version Output
        id: set_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" =~ refs/tags/v ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version determined as: $VERSION"

  build-android:
    name: Build Android APK
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK Release
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniAttend-${{ needs.get-version.outputs.version }}-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows App
    needs: get-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Archive Windows Release
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath UniAttend-${{ needs.get-version.outputs.version }}-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniAttend-${{ needs.get-version.outputs.version }}-Windows
          path: UniAttend-${{ needs.get-version.outputs.version }}-Windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux App
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Archive Linux Release
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../UniAttend-${{ needs.get-version.outputs.version }}-Linux.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniAttend-${{ needs.get-version.outputs.version }}-Linux
          path: UniAttend-${{ needs.get-version.outputs.version }}-Linux.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS App
    needs: get-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Archive macOS Release
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../UniAttend-${{ needs.get-version.outputs.version }}-macOS.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniAttend-${{ needs.get-version.outputs.version }}-macOS
          path: UniAttend-${{ needs.get-version.outputs.version }}-macOS.zip
          if-no-files-found: error

  build-ios:
    name: Build iOS App (Unsigned)
    needs: get-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Archive iOS Release
        run: |
          cd build/ios/iphoneos
          zip -r ../../../UniAttend-${{ needs.get-version.outputs.version }}-iOS.zip Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniAttend-${{ needs.get-version.outputs.version }}-iOS
          path: UniAttend-${{ needs.get-version.outputs.version }}-iOS.zip
          if-no-files-found: error
